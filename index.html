<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AK Music Apps</title>
<style>
:root{--bg:#d9d9e2;--ink:#2a2a33;--card:#fff;--mute:#55555f}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0c;--ink:#e8e8ee;--card:#1b1b20;--mute:#9a9aa6}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
main{width:min(720px,92vw);display:grid;gap:16px;padding:24px 0}
h1{margin:0;font-size:28px}p{margin:0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a.card{display:grid;gap:6px;background:var(--card);border-radius:14px;padding:18px;text-decoration:none;color:inherit;border:2px solid #3a3a40}
a.card:hover,a.card:focus-visible{border-color:#ff9a2e;outline:none}
a.card b{font-size:18px}a.card span{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main>
<h1>AK Music Apps</h1>
<p>Created by Aswin Kumar. Works in any modern browser, no install needed.</p>
<div class="grid">
<a class="card" href="ak-rhythm-pad.html"><b>AK RHYTHM PAD</b><span>Pad and loop machine with 14 kits, a step sequencer and a record-to-loop feature.</span></a>
<a class="card" href="ak-shred.html"><b>AK SHRED</b><span>Touch string instrument with glides, scale lock, an Indian veena sound and a looper.</span></a>
</div>
</main>
</body>
</html>
